---
- name: Verify OSPF deployment
  hosts: routers
  gather_facts: false

  tasks:
    - name: Collect interface, neighbor and route information
      cisco.ios.ios_command:
        commands:
          - show ip interface brief
          - show ip ospf neighbor
          - show ip route ospf
      register: result

    - name: Display OSPF neighbors
      ansible.builtin.debug:
        var: result.stdout_lines[1]

    - name: Display OSPF routes
      ansible.builtin.debug:
        var: result.stdout_lines[2]

    - name: Assert the expected number of FULL OSPF neighbors
      ansible.builtin.assert:
        that:
          - "(result.stdout[1] | regex_findall('FULL') | length) == (expected_ospf_neighbors | int)"
        success_msg: "{{ inventory_hostname }} has {{ expected_ospf_neighbors }} FULL OSPF neighbors"
        fail_msg: "{{ inventory_hostname }} does not have {{ expected_ospf_neighbors }} FULL OSPF neighbors"
