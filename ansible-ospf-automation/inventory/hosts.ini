[routers]
R1 ansible_host=192.168.90.1
R2 ansible_host=192.168.90.2
R3 ansible_host=192.168.90.5

[routers:vars]
ansible_connection=ansible.netcommon.network_cli
ansible_user=%ENV{ANSIBLE_USER}
ansible_pass=%ENV{ANSIBLE_PASS}
ansible_network_os=cisco.ios.ios
ansible_ssh_common_args='-o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa'
